version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: kanakku_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kanakku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kanakku_secret_123}
      POSTGRES_DB: ${POSTGRES_DB:-kanakku_prod}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanakku -d kanakku_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
